name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0

      - name: Build
        run: zig build

      - name: Force-compile all public API (dead-code guard)
        run: zig build compile-all

      - name: Run unit tests
        run: zig build test

      - name: Build examples
        run: zig build examples

      - name: Run benchmarks
        run: zig build run-benchmark

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0

      - name: Run fuzz tests (5 minutes each)
        run: |
          timeout 300 zig build run-parser-fuzz; code=$?; if [ $code -ne 0 ] && [ $code -ne 124 ]; then exit $code; fi
          timeout 300 zig build run-json-fuzz; code=$?; if [ $code -ne 0 ] && [ $code -ne 124 ]; then exit $code; fi

  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0

      - name: Run tests with leak detection
        run: zig test src/zgraphql.zig -OReleaseSafe

  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0

      - name: Run stress test (60s sustained load)
        run: |
          zig build -Doptimize=ReleaseSafe
          timeout 90 ./zig-out/bin/stress-test
