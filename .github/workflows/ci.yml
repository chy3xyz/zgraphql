name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0

      - name: Build
        run: zig build

      - name: Run unit tests
        run: zig build test

      - name: Build examples
        run: zig build examples

      - name: Run benchmarks
        run: zig build run-benchmark

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0

      - name: Run fuzz tests (5 minutes each)
        run: |
          timeout 300 zig build run-parser-fuzz || true
          timeout 300 zig build run-json-fuzz || true

  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0

      - name: Run tests with leak detection
        run: zig test src/zgraphql.zig -OReleaseSafe
